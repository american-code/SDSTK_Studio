<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211F36"/>
      <stop offset="100%" stop-color="#342C57"/>
    </linearGradient>
    <radialGradient id="blueOrb" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#6FC1FF"/>
      <stop offset="100%" stop-color="#0A66CC"/>
    </radialGradient>
    <radialGradient id="greenOrb" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#7CEBA0"/>
      <stop offset="100%" stop-color="#1E9E45"/>
    </radialGradient>
    <radialGradient id="purpleOrb" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#E19BFF"/>
      <stop offset="100%" stop-color="#9433D6"/>
    </radialGradient>
    <radialGradient id="orangeOrb" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#FFC169"/>
      <stop offset="100%" stop-color="#E07D00"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="dockShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS Big Sur-style squircle: inset ~100px, transparent surround, OS does not auto-mask -->
  <g filter="url(#dockShadow)">
    <rect x="100" y="100" width="824" height="824" rx="182" ry="182" fill="url(#bg)"/>
  </g>

  <g transform="translate(100,100) scale(0.804687)">
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round">
      <path d="M 478 360 Q 512 328 546 360"/>
      <path d="M 664 478 Q 696 512 664 546"/>
      <path d="M 478 664 Q 512 696 546 664"/>
      <path d="M 360 478 Q 328 512 360 546"/>
    </g>

    <g filter="url(#soft)">
      <circle cx="360" cy="360" r="118" fill="url(#blueOrb)"/>
      <circle cx="664" cy="360" r="118" fill="url(#greenOrb)"/>
      <circle cx="360" cy="664" r="118" fill="url(#purpleOrb)"/>
      <circle cx="664" cy="664" r="118" fill="url(#orangeOrb)"/>
    </g>
  </g>
</svg>
